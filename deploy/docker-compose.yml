services:
  mysql:
    image: mysql:8.0.39
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: guiguxiaozhi
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD before starting compose}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis/redis-stack-server:7.2.0-v18
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  app:
    build:
      context: ../ai-medical-care
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_started
    environment:
      SERVER_PORT: 5137
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/guiguxiaozhi?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD before starting compose}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/chat_memory_db
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      KNOWLEDGE_REDIS_HOST: redis
      JWT_USER_SECRET_KEY: ${JWT_USER_SECRET_KEY:?set JWT_USER_SECRET_KEY before starting compose}
      JWT_ADMIN_SECRET_KEY: ${JWT_ADMIN_SECRET_KEY:?set JWT_ADMIN_SECRET_KEY before starting compose}
      DASH_SCOPE_API_KEY: ${DASH_SCOPE_API_KEY:-}
    ports:
      - "5137:5137"

volumes:
  mysql-data:
  redis-data:
  mongo-data:
