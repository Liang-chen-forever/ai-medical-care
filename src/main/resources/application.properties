# Redis ?? (langchain4j-community-redis-spring-boot-starter ??? spring-boot-starter-data-redis)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Knowledge document uploads are UTF-8 text/Markdown and capped at 2 MiB.
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Knowledge Redis defaults can be overridden without changing deployment configuration.
app.knowledge.redis.host=${KNOWLEDGE_REDIS_HOST:localhost}
app.knowledge.redis.port=${KNOWLEDGE_REDIS_PORT:6379}
app.knowledge.redis.index-name=${KNOWLEDGE_REDIS_INDEX_NAME:xiaozhi-index}
app.knowledge.redis.prefix=${KNOWLEDGE_REDIS_PREFIX:langchain4j:vector:xiaozhi:}
app.knowledge.redis.dimension=${KNOWLEDGE_REDIS_DIMENSION:1024}

