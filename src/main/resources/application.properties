#web????
server.port=5137

# 本地开发时从被 Git 忽略的 secrets.local.txt 读取敏感配置。
spring.config.import=optional:file:./secrets.local.txt[.properties]

# 应用安全配置：真实值只在环境变量或被 Git 忽略的 secrets.local.txt 中保存。
jwt.admin-secret-key=${JWT_ADMIN_SECRET_KEY:}
jwt.admin-ttl=${JWT_ADMIN_TTL:7200000}
jwt.admin-token-name=${JWT_ADMIN_TOKEN_NAME:token}
jwt.user-secret-key=${JWT_USER_SECRET_KEY:}
jwt.user-ttl=${JWT_USER_TTL:7200000}
jwt.user-token-name=${JWT_USER_TOKEN_NAME:authentication}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://localhost:5174,http://localhost:8088,http://127.0.0.1:8088}

#??????? (redis ? pinecone)
